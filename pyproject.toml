[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreams-web"
version = "0.0.1"
description = "FastAPI + HTMX web service for DreaMS spectral library matching (deployed on terka)."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
# DreaMS + heavy ML deps are wired in Phase 1; kept separate so the web layer tests stay light.
dreams = [
    "dreams @ git+https://github.com/pluskal-lab/DreaMS.git@dbec3a0b514a99e5056cfccde4559fda8cfe8129",
]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "black",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["dreams_web*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
# Apply per-module follow_imports="skip" to .pyi stubs too (rdkit-stubs is malformed).
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# pandas/rdkit cross the untyped DreaMS boundary; don't deep-check their stubs here
# (rdkit-stubs also ships a malformed .pyi that breaks mypy).
module = ["pandas", "pandas.*", "rdkit", "rdkit.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: integration test needing the DreaMS model (skipped by default)"]
addopts = "-m 'not slow'"
